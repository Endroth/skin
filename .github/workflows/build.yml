name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: SkinChanger
          path: target/*.jar
